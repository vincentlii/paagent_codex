[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-agent"
version = "0.1.0"
description = "Price Action AI assistant: MT5 kline data, two-stage LLM analysis (AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "PA Agent Team" }]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "cryptography>=42",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "numpy>=1.26",
]
tradingview = [
    "pandas>=2.2",
    "requests>=2.32",
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923",
]
native-exchanges = [
    "curl_cffi>=0.13",
]
ashare = [
    "pandas>=2.2",
    "requests>=2.32",
    "curl_cffi>=0.13",
    "akshare>=1.14",
    "baostock>=0.8",
    "tushare>=1.4",
]
yfinance = [
    "pandas>=2.2",
    "yfinance>=0.2.65",
]
cursor = [
    "cursor-sdk>=0.1.0",
]
notifications = [
    "requests>=2.32",
]
mt5 = [
    "MetaTrader5>=5.0; sys_platform == 'win32'",
]
vps = [
    "curl_cffi>=0.13",
]
desktop = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "requests>=2.32",
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923",
    "curl_cffi>=0.13",
    "akshare>=1.14",
    "baostock>=0.8",
    "tushare>=1.4",
    "yfinance>=0.2.65",
    "cursor-sdk>=0.1.0",
    "MetaTrader5>=5.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "ruff>=0.5",
    "black>=24.4",
    "build>=1.2",
]

[project.scripts]
pa-agent = "pa_agent.main:main"
pa-agent-headless = "pa_agent.headless:main"
pa-agent-dashboard = "pa_agent.dashboard:main"
pa-agent-paper-report = "pa_agent.execution.reporting:main"
pa-agent-aabb = "pa_agent.experiments.cli:single_main"
pa-agent-aabb-monitor = "pa_agent.experiments.cli:continuous_main"

[tool.setuptools.packages.find]
include = ["pa_agent*", "prompt_engineering*"]

[tool.setuptools.package-data]
prompt_engineering = ["**/*.txt", "**/*.md"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "unit: unit-level tests",
    "property: property-based tests (hypothesis)",
    "integration: integration tests crossing module boundaries",
    "e2e: end-to-end smoke tests",
    "live: requires real API key via environment variable (never uses config/settings.json)",
]
